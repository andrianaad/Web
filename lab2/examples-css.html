<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Лабораторна 2</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #efe4e4;
        }
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background-color: #efe4e4;
            padding: 30px 0;
            z-index: 1000;
        }
        nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            margin: 0;
            padding: 0;
        }

        nav ul li {
            margin: 0 20px;
            color: rgb(5, 5, 5);
            cursor: pointer;
        }

        nav ul li:hover {
            color: rgb(206, 21, 21);
        }

        .container {
            margin-top: 80px; 
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 40px;
            padding: 20px;
        }

        .box {
            width: 200px;
            height: 200px;
            background-color: #9d0725;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 15px; 
            margin: 10px; 
            border-radius: 10px;
            position: relative;
            font-size: 18px;
            transition: 0.3s;
        }

        .box:hover {
            background-color: #9d0725;
            transform: scale(1.05);
        }

        .box::before {
            content: "★ ";
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 20px;
        }

        @media (max-width: 768px) {
            .box {
                width: 150px;
                height: 150px;
                font-size: 14px;
            }
        }

        @media (max-width: 480px) {
            .container {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>

<body>
    <nav>
        <ul>
            <li>Головна</li>
            <li>Про нас</li>
            <li>Контакти</li>
        </ul>
    </nav>

    <section class="container">
     <div class="box">HTML<br>Структура сторінки</div>
     <div class="box">CSS<br>Стилізація елементів</div>
     <div class="box">JavaScript<br>Інтерактивність</div>
     <div class="box">Flexbox<br>Гнучке розташування</div>
     <div class="box">Grid<br>Сіткова система</div>
     <div class="box">Responsive<br>Адаптивний дизайн</div>
     <div class="box">UI/UX<br>Дизайн інтерфейсу</div>
     <div class="box">SEO<br>Оптимізація</div>
     <div class="box">Bootstrap<br>CSS-фреймворк</div>
     <div class="box">Git<br>Контроль версій</div>
    </section>

</body>
</html>
